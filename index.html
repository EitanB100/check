<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Prediction Markets Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #e2e8f0;
            --card-bg: #151b2b;
            --card-expanded-bg: #1a2235;
            --border-color: #1f2937;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --positive: #10b981;
            --positive-bg: rgba(16, 185, 129, 0.1);
            --negative: #ef4444;
            --negative-bg: rgba(239, 68, 68, 0.1);
            --neutral: #94a3b8;
            --neutral-bg: rgba(148, 163, 184, 0.1);
        }
        
        .light-mode {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --card-expanded-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --positive: #16a34a;
            --positive-bg: rgba(22, 163, 74, 0.1);
            --negative: #dc2626;
            --negative-bg: rgba(220, 38, 38, 0.1);
            --neutral: #64748b;
            --neutral-bg: rgba(100, 116, 139, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .timer-container {
            font-size: 0.875rem;
            color: var(--neutral);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .timer-container .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: var(--border-color);
        }
        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toggle {
            display: inline-block;
            width: 48px;
            height: 26px;
            background-color: var(--border-color);
            border-radius: 26px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .toggle.dark {
            background-color: var(--primary);
        }
        
        .toggle-slider {
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle.dark .toggle-slider {
            transform: translateX(22px);
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .summary-stat {
            text-align: center;
            padding: 8px 16px;
        }

        .summary-stat .label {
            font-size: 0.875rem;
            color: var(--neutral);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .summary-stat .value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .category {
            margin-bottom: 32px;
        }

        .category-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .category-header:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .light-mode .category-header:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .category-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .arrow {
            transition: transform 0.3s ease;
            font-size: 0.875rem;
            color: var(--neutral);
        }

        .category-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .category-content.collapsed {
            display: none;
        }

        /* Market Card & Expansion logic */
        .market-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        .market-container:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .market-row {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .market-info {
            flex: 1;
            padding-right: 24px;
        }

        .market-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            line-height: 1.4;
        }

        .market-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.1);
            transition: background 0.2s;
        }
        .market-link:hover {
            background: rgba(59, 130, 246, 0.2);
            text-decoration: none;
        }

        .market-stats {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 90px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--neutral);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .profit-loss, .pnl-box {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 100px;
        }
        
        .pnl-amount {
            font-size: 1.1rem;
        }
        .pnl-percent {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .positive { background-color: var(--positive-bg); color: var(--positive); }
        .negative { background-color: var(--negative-bg); color: var(--negative); }
        .neutral { background-color: var(--neutral-bg); color: var(--neutral); }

        .expand-icon {
            margin-left: 20px;
            color: var(--neutral);
            transition: transform 0.3s;
        }
        .market-container.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .market-expanded-content {
            background: var(--card-expanded-bg);
            border-top: 1px solid var(--border-color);
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .market-container.expanded .market-expanded-content {
            max-height: 400px; /* arbitrary large max height */
            padding: 20px;
        }
        .market-expanded-content iframe {
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
        }

        /* Login Screen */
        #login {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #login.hidden {
            display: none;
        }
        #login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        #login-card h2 {
            margin-top: 0;
            margin-bottom: 24px;
        }
        #login input {
            width: 80%;
            padding: 12px 16px;
            margin-bottom: 20px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
        }
        #login button {
            width: 80%;
            padding: 12px 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #login button:hover {
            background-color: var(--primary-hover);
        }
        
        /* Updating Animation */
        @keyframes flash-update {
            0% { background-color: rgba(59, 130, 246, 0.2); }
            100% { background-color: transparent; }
        }
        .updated {
            animation: flash-update 1s ease-out;
        }

        /* Trending modular grid */
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .trending-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .trending-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .trending-card h3 {
            font-size: 0.95rem;
            margin: 0 0 12px 0;
            font-weight: 500;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div id="login">
        <div id="login-card">
            <form id="login-form">
                <h2>Access Dashboard</h2>
                <input type="password" id="password" placeholder="Enter Password" required>
                <button type="submit">Unlock</button>
            </form>
        </div>
    </div>
    
    <div id="dashboard" class="hidden">
        <header>
            <div class="header-left">
                <h1>Prediction Markets</h1>
                <div class="timer-container">
                    <div class="pulse"></div>
                    <span>Auto refresh in <strong id="refresh-timer" style="color: var(--text-color);">15</strong>s</span>
                    <button class="refresh-btn" onclick="forceRefresh()" id="manual-refresh-btn" title="Refresh Now">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                        Refresh
                    </button>
                </div>
            </div>
            <div class="header-right">
                <span id="mode-text" style="font-size: 0.875rem; color: var(--neutral); font-weight: 500;">Dark</span>
                <div class="toggle dark" id="theme-toggle">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </header>

        <div class="summary-card">
            <div class="summary-stat">
                <div class="label">Total Invested</div>
                <div class="value" id="tot-invested">$0.00</div>
            </div>
            <div class="summary-stat">
                <div class="label">Current Value</div>
                <div class="value" id="tot-value">$0.00</div>
            </div>
            <div class="summary-stat">
                <div class="label">Unrealized P/L</div>
                <div class="value neutral" id="tot-pnl">$0.00 <span style="font-size:1rem; opacity:0.8; font-weight:500;">(0.00%)</span></div>
            </div>
        </div>

        <div id="dashboard-content">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION DATA ---
        const portfolioConfig = [
            {
                category: "Cuba",
                markets: [
                    {
                        title: "Cuban Regime Falls in 2026?",
                        slug: "cuban-regime-falls-in-2026",
                        link: "https://polymarket.com/event/cuban-regime-falls-in-2026",
                        shares: 163.0,
                        invested: 55.42
                    }
                ]
            },
            {
                category: "Trump",
                markets: [
                    {
                        title: "Will Trump meet with Xi Jinping in March 2026?",
                        slug: "will-trump-meet-with-xi-jinping-in-march-2026-241",
                        link: "https://polymarket.com/event/who-will-trump-meet-with-in-march",
                        shares: 22.1,
                        invested: 7.07
                    },
                    {
                        title: 'Will Trump say "Khamenei" this week? (March 22)',
                        slug: "will-trump-say-khamenei-this-week-march-22",
                        link: "https://polymarket.com/event/what-will-trump-say-this-week-march-22",
                        shares: 23.3,
                        invested: 10.00
                    }
                ]
            },
            {
                category: "Iran",
                markets: [
                    {
                        title: "Naim Qassem out as Hezbollah’s secretary-general by March 31, 2026?",
                        slug: "naim-qassem-out-as-hezbollahs-secretary-general-by-march-31-2026",
                        link: "https://polymarket.com/event/naim-qassem-out-as-hezbollahs-secretary-general-by-december-31",
                        shares: 34.0,
                        invested: 10.00
                    },
                    {
                        title: "Iran x Israel/US conflict ends by April 15?",
                        slug: "iran-x-israelus-conflict-ends-by-april-15-618",
                        link: "https://polymarket.com/event/iran-x-israelus-conflict-ends-by",
                        shares: 30.3,
                        invested: 10.00
                    },
                    {
                        title: "Iran leadership change by March 31?",
                        slug: "iran-leadership-change-by-march-31",
                        link: "https://polymarket.com/event/iran-leadership-change-by",
                        shares: 58.8,
                        invested: 10.00
                    },
                    {
                        title: "Strait of Hormuz traffic returns to normal by end of April?",
                        slug: "strait-of-hormuz-traffic-returns-to-normal-by-april-30",
                        link: "https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-april-30",
                        shares: 27.1,
                        invested: 8.66
                    },
                    {
                        title: "Iran leadership change by April 30?",
                        slug: "iran-leadership-change-by-april-30",
                        link: "https://polymarket.com/event/iran-leadership-change-by",
                        shares: 19.3,
                        invested: 8.32
                    },
                    {
                        title: "Iran coup attempt by June 30?",
                        slug: "iran-coup-attempt-by-june-30",
                        link: "https://polymarket.com/event/iran-coup-attempt-by-june-30",
                        shares: 21.7,
                        invested: 5.00
                    },
                    {
                        title: "Iran leadership change by March 13?",
                        slug: "iran-leadership-change-by-march-13",
                        link: "https://polymarket.com/event/iran-leadership-change-by",
                        shares: 500.0,
                        invested: 1.00
                    }
                ]
            }
        ];

        // Global state for live data
        let marketDataStore = {};
        const REFRESH_INTERVAL_SECONDS = 15;
        let countdown = REFRESH_INTERVAL_SECONDS;
        let isFetching = false;

        // --- RENDER FUNCTIONS ---
        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            container.innerHTML = '';
            
            portfolioConfig.forEach(cat => {
                container.appendChild(buildCategoryHtml(cat.category, cat.markets));
            });

            // Placeholder for Trending section
            const trendingDiv = document.createElement('div');
            trendingDiv.id = 'trending-geopolitics-container';
            container.appendChild(trendingDiv);

            fetchTrendingGeopolitics();
        }

        function toggleMarketExpand(marketId) {
            const container = document.getElementById(`container-${marketId}`);
            container.classList.toggle('expanded');
        }

        function buildCategoryHtml(categoryName, markets) {
            const catDiv = document.createElement('div');
            catDiv.className = 'category';
            const catId = categoryName.replace(/\s/g, '');
            
            const header = document.createElement('div');
            header.className = 'category-header';
            header.onclick = () => {
                const content = document.getElementById(catId);
                const arrow = header.querySelector('.arrow');
                content.classList.toggle('collapsed');
                arrow.style.transform = content.classList.contains('collapsed') ? 'rotate(-90deg)' : 'rotate(0deg)';
            };
            header.innerHTML = `
                <span class="arrow" style="transform: rotate(0deg);">▼</span>
                <h2>${categoryName}</h2>
            `;
            
            const content = document.createElement('div');
            content.id = catId;
            content.className = 'category-content';

            markets.forEach(market => {
                marketDataStore[market.slug] = market;

                const wrapper = document.createElement('div');
                wrapper.className = 'market-container';
                wrapper.id = `container-${market.slug}`;

                const row = document.createElement('div');
                row.className = 'market-row';
                row.id = `row-${market.slug}`;
                row.setAttribute('data-market', market.slug);
                row.setAttribute('data-shares', market.shares);
                row.setAttribute('data-invested', market.invested);

                // Clicking row expands to show chart, but clicking link opens new tab
                row.onclick = (e) => {
                    if (e.target.closest('.market-link')) return; 
                    toggleMarketExpand(market.slug);
                };

                row.innerHTML = `
                    <div class="market-info">
                        <h3 class="market-title">${market.title}</h3>
                        <a href="${market.link}" class="market-link" target="_blank">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            View on Polymarket
                        </a>
                    </div>
                    <div class="market-stats">
                        <div class="stat-group">
                            <span class="stat-label">Shares</span>
                            <span class="stat-value">${market.shares.toFixed(1)}</span>
                        </div>
                        <div class="stat-group">
                            <span class="stat-label">Invested</span>
                            <span class="stat-value">$${market.invested.toFixed(2)}</span>
                        </div>
                        <div class="stat-group">
                            <span class="stat-label">Value</span>
                            <span class="stat-value current-value" style="color:var(--neutral)">--</span>
                        </div>
                        <div class="pnl-box neutral profit-loss">
                            <span class="pnl-amount">--</span>
                            <span class="pnl-percent"></span>
                        </div>
                        <div class="expand-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>
                `;

                const expandContent = document.createElement('div');
                expandContent.className = 'market-expanded-content';
                expandContent.innerHTML = `
                    <iframe title="${market.title}" src="https://embed.polymarket.com/market?market=${market.slug}&theme=dark&creator=EthanB123&height=300" height="300" frameborder="0" allowtransparency="true"></iframe>
                `;

                wrapper.appendChild(row);
                wrapper.appendChild(expandContent);
                content.appendChild(wrapper);
            });
            
            catDiv.appendChild(header);
            catDiv.appendChild(content);
            return catDiv;
        }

        // --- DYNAMIC GEOPOLITICS FETCH ---
        async function fetchTrendingGeopolitics() {
            try {
                // Fetch events from Gamma API
                const res = await fetch('https://gamma-api.polymarket.com/events?limit=50&active=true&closed=false');
                const data = await res.json();
                
                const trendingMarkets = [];
                for (const event of data) {
                    const tags = (event.tags || []).map(t => typeof t === 'object' ? t.id.toLowerCase() : t.toLowerCase());
                    const slugText = (event.slug || "").toLowerCase();
                    const titleText = (event.title || "").toLowerCase();
                    
                    const isGeo = tags.includes('geopolitics') || tags.includes('middle east') 
                                || tags.includes('global politics') || tags.includes('politics')
                                || slugText.includes('geopolitics') || titleText.includes('war') || titleText.includes('election');

                    if (isGeo && event.markets && event.markets.length > 0) {
                        const mainMarket = event.markets[0];
                        if (!Object.keys(marketDataStore).includes(mainMarket.slug)) {
                            trendingMarkets.push({
                                title: event.title,
                                slug: mainMarket.slug,
                                link: `https://polymarket.com/event/${event.slug}`,
                            });
                        }
                    }
                    if (trendingMarkets.length >= 4) break;
                }

                if (trendingMarkets.length > 0) {
                    const container = document.getElementById('trending-geopolitics-container');
                    
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category';
                    catDiv.innerHTML = `
                        <div class="category-header">
                            <h2 style="margin-left:8px;">📈 Trending Geopolitics (Ideas)</h2>
                        </div>
                        <div class="trending-grid" id="trending-grid-content"></div>
                    `;
                    container.appendChild(catDiv);

                    const grid = document.getElementById('trending-grid-content');
                    trendingMarkets.forEach(m => {
                        const card = document.createElement('div');
                        card.className = 'trending-card';
                        card.innerHTML = `
                            <h3>${m.title}</h3>
                            <a href="${m.link}" class="market-link" target="_blank" style="margin-top: 12px; align-self: flex-start;">
                                Explore Market →
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (err) {
                console.error("Geopolitics fetch error", err);
            }
        }

        // --- PASSWORD & UI ---
        const correctPassword = 'IWonULoseBro7';
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('password').value === correctPassword) {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                // Initialize modules
                renderDashboard();
                updateLivePrices();
                startTimer();
            } else {
                alert('Incorrect password.');
                document.getElementById('password').value = '';
            }
        });

        const body = document.body;
        const toggle = document.getElementById('theme-toggle');
        const modeText = document.getElementById('mode-text');
        
        toggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            toggle.classList.toggle('dark');
            modeText.textContent = body.classList.contains('light-mode') ? 'Light' : 'Dark';
        });

        // --- LIVE PRICING FETCH ---
        function startTimer() {
            setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    updateLivePrices();
                }
                document.getElementById('refresh-timer').textContent = countdown < 0 ? 0 : countdown;
            }, 1000);
        }

        function forceRefresh() {
            if (isFetching) return;
            countdown = REFRESH_INTERVAL_SECONDS;
            document.getElementById('refresh-timer').textContent = countdown;
            updateLivePrices();
        }

        async function updateLivePrices() {
            if (isFetching) return;
            isFetching = true;
            
            const refreshBtn = document.getElementById('manual-refresh-btn');
            refreshBtn.classList.add('spinning');

            const marketRows = document.querySelectorAll('.market-row[data-invested]');
            let totalInvested = 0;
            let totalValue = 0;

            // Fetch concurrently from gamma-api /events matching slug. 
            // Our previous call failed because /events structure is nested.
            const promises = Array.from(marketRows).map(async (row) => {
                const marketId = row.getAttribute('data-market');
                const shares = parseFloat(row.getAttribute('data-shares'));
                const invested = parseFloat(row.getAttribute('data-invested'));
                
                if (!marketId || !shares || !invested) return null;
                
                try {
                    // Fetch directly from markets endpoint
                    const res = await fetch(`https://gamma-api.polymarket.com/markets?slug=${marketId}`);
                    if (!res.ok) throw new Error("API returned status " + res.status);
                    
                    const data = await res.json();
                    
                    let price = null;
                    let market = null;

                    if (Array.isArray(data) && data.length > 0) {
                        market = data[0]; 
                    } else if (data && data.events && data.events.length > 0 && data.events[0].markets) {
                        market = data.events[0].markets[0];
                    } else if (data && !Array.isArray(data)) {
                         market = data;
                    }

                    if (market) {
                        // Parse JSON outcome prices. Index 0 is typically the YES price on binary.
                        if (market.outcomePrices) {
                            try {
                                const parsedPrices = (typeof market.outcomePrices === 'string') 
                                    ? JSON.parse(market.outcomePrices) 
                                    : market.outcomePrices;
                                price = parseFloat(parsedPrices[0]);
                            } catch(e){}
                        }
                        
                        if (price === null || isNaN(price)) {
                            price = parseFloat(market.lastTradePrice || market.price);
                        }
                    }

                    if (price !== null && !isNaN(price)) {
                        row.classList.remove('updated');
                        void row.offsetWidth; // trigger reflow
                        row.classList.add('updated');
                        return { row, price, shares, invested };
                    }
                } catch (error) {
                    console.error(`Failed fetching ${marketId}:`, error);
                }
                
                // If fetch fails, return null price flag
                return { row, price: null, shares, invested };
            });

            const results = await Promise.all(promises);

            results.forEach(res => {
                if (!res) return;
                totalInvested += res.invested;
                
                if (res.price !== null) {
                    const val = updatePnL(res.row, res.price, res.shares, res.invested);
                    totalValue += val;
                } else {
                    totalValue += res.invested; // Neutral fallback if api call block or failed
                }
            });
            
            updateTotalSummary(totalInvested, totalValue);

            isFetching = false;
            countdown = REFRESH_INTERVAL_SECONDS;
            document.getElementById('refresh-timer').textContent = countdown;
            refreshBtn.classList.remove('spinning');
        }

        function updatePnL(row, currentPrice, shares, invested) {
            const currentValue = shares * currentPrice;
            const pnlAmount = currentValue - invested;
            const pnlPercent = invested > 0 ? (pnlAmount / invested) * 100 : 0;

            const valSpan = row.querySelector('.current-value');
            if (valSpan) {
                valSpan.textContent = `$${currentValue.toFixed(2)}`;
                valSpan.style.color = 'inherit';
            }

            const pnlSpan = row.querySelector('.pnl-amount');
            const pctSpan = row.querySelector('.pnl-percent');
            const pnlBox = row.querySelector('.pnl-box');

            if (pnlSpan) {
                const sign = pnlAmount >= 0 ? '+' : '';
                pnlSpan.textContent = `${sign}$${Math.abs(pnlAmount).toFixed(2)}`;
            }

            if (pctSpan) {
                const sign = pnlPercent >= 0 ? '+' : '';
                pctSpan.textContent = `(${sign}${Math.abs(pnlPercent).toFixed(2)}%)`;
            }

            if (pnlBox) {
                pnlBox.classList.remove('positive', 'negative', 'neutral');
                if (pnlAmount > 0.01) {
                    pnlBox.classList.add('positive');
                } else if (pnlAmount < -0.01) {
                    pnlBox.classList.add('negative');
                } else {
                    pnlBox.classList.add('neutral');
                }
            }
            return currentValue;
        }
        
        function updateTotalSummary(invested, value) {
            const pnl = value - invested;
            const pnlPercent = invested > 0 ? (pnl / invested) * 100 : 0;
            
            document.getElementById('tot-invested').textContent = `$${invested.toFixed(2)}`;
            document.getElementById('tot-value').textContent = `$${value.toFixed(2)}`;
            
            const pnlBox = document.getElementById('tot-pnl');
            const sign = pnl >= 0 ? '+' : '';
            
            pnlBox.innerHTML = `${sign}$${Math.abs(pnl).toFixed(2)} <span style="font-size:1rem; opacity:0.8; font-weight:500;">(${sign}${Math.abs(pnlPercent).toFixed(2)}%)</span>`;
            
            pnlBox.className = 'value ' + (pnl > 0.01 ? 'positive' : (pnl < -0.01 ? 'negative' : 'neutral'));
        }
    </script>
</body>
</html>
