<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Prediction Markets Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --text: #e2e8f0;
            --card: #151b2b;
            --card-exp: #1a2235;
            --border: #1f2937;
            --primary: #3b82f6;
            --primary-h: #2563eb;
            --pos: #10b981;
            --pos-bg: rgba(16,185,129,.1);
            --neg: #ef4444;
            --neg-bg: rgba(239,68,68,.1);
            --muted: #94a3b8;
            --muted-bg: rgba(148,163,184,.1);
        }
        .light-mode {
            --bg: #f8fafc; --text: #0f172a; --card: #fff; --card-exp: #f1f5f9;
            --border: #e2e8f0; --primary: #2563eb; --primary-h: #1d4ed8;
            --pos: #16a34a; --pos-bg: rgba(22,163,74,.1);
            --neg: #dc2626; --neg-bg: rgba(220,38,38,.1);
            --muted: #64748b; --muted-bg: rgba(100,116,139,.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:24px; transition:background .3s,color .3s; }

        /* ── Header ─────────────────────────────── */
        header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:12px; }
        .hdr-left h1 { font-size:1.6rem; font-weight:700; letter-spacing:-.02em; }
        .timer-row { font-size:.82rem; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:10px; }
        .pulse { width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulse 2s infinite; }
        @keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(59,130,246,.7)}70%{transform:scale(1);box-shadow:0 0 0 6px rgba(59,130,246,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(59,130,246,0)}}
        .btn-sm { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:6px; font-size:.78rem; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .2s; font-family:inherit; }
        .btn-sm:hover { background:var(--border); }
        .btn-sm.spinning svg { animation:spin 1s linear infinite; }
        @keyframes spin{100%{transform:rotate(360deg)}}
        .hdr-right { display:flex; align-items:center; gap:14px; }
        .toggle { width:44px;height:24px;background:var(--border);border-radius:24px;position:relative;cursor:pointer;transition:background .3s; }
        .toggle.dark { background:var(--primary); }
        .toggle-dot { position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .3s; }
        .toggle.dark .toggle-dot { transform:translateX(20px); }

        /* ── Summary ────────────────────────────── */
        .summary { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:28px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
        .s-stat { text-align:center; padding:6px 14px; }
        .s-label { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; }
        .s-value { font-size:1.8rem; font-weight:700; letter-spacing:-.02em; }

        /* ── View toggle ────────────────────────── */
        .view-bar { display:flex; justify-content:flex-end; margin-bottom:16px; gap:8px; }
        .view-bar .btn-sm.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        /* ── Category ───────────────────────────── */
        .category { margin-bottom:28px; }
        .cat-hdr { cursor:pointer; display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:6px 10px; border-radius:8px; transition:background .2s; }
        .cat-hdr:hover { background:rgba(255,255,255,.05); }
        .light-mode .cat-hdr:hover { background:rgba(0,0,0,.04); }
        .cat-hdr h2 { font-size:1.15rem; font-weight:600; }
        .arrow { transition:transform .3s; font-size:.8rem; color:var(--muted); }
        .cat-body { display:flex; flex-direction:column; gap:14px; }
        .cat-body.collapsed { display:none; }

        /* ── List‑view market card ──────────────── */
        .m-wrap { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:all .2s; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .m-wrap:hover { border-color:var(--primary); }
        .m-row { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
        .m-info { flex:1; padding-right:20px; }
        .m-title { font-size:.98rem; font-weight:600; margin:0 0 6px; line-height:1.35; }
        .m-link { font-size:.75rem; color:var(--primary); text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-weight:500; padding:3px 7px; border-radius:4px; background:rgba(59,130,246,.1); transition:background .2s; }
        .m-link:hover { background:rgba(59,130,246,.2); }
        .m-stats { display:flex; gap:24px; align-items:center; }
        .sg { display:flex; flex-direction:column; gap:3px; min-width:75px; }
        .sg-l { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
        .sg-v { font-size:.92rem; font-weight:600; }
        .pnl-box { padding:5px 10px; border-radius:7px; font-weight:600; font-size:.85rem; display:flex; flex-direction:column; align-items:flex-end; min-width:90px; }
        .pnl-amt { font-size:1rem; }
        .pnl-pct { font-size:.7rem; opacity:.9; }
        .positive { background:var(--pos-bg); color:var(--pos); }
        .negative { background:var(--neg-bg); color:var(--neg); }
        .neutral  { background:var(--muted-bg); color:var(--muted); }
        .exp-icon { margin-left:16px; color:var(--muted); transition:transform .3s; }
        .m-wrap.expanded .exp-icon { transform:rotate(180deg); }
        .m-expand { background:var(--card-exp); border-top:1px solid var(--border); max-height:0; overflow:hidden; transition:max-height .4s ease-out,padding .4s ease; display:flex; justify-content:center; }
        .m-wrap.expanded .m-expand { max-height:360px; padding:16px; }
        .m-expand iframe { border-radius:8px; max-width:580px; width:100%; }

        /* ── Grid / Card view ──────────────────── */
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
        .card-cell { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:all .2s; }
        .card-cell:hover { border-color:var(--primary); }
        .card-cell .card-head { padding:14px 16px; }
        .card-cell .card-head h3 { font-size:.92rem; font-weight:600; margin:0 0 4px; }
        .card-cell .card-stats { display:flex; gap:16px; font-size:.78rem; color:var(--muted); margin-bottom:6px; }
        .card-cell .card-stats span { font-weight:600; color:var(--text); }
        .card-cell iframe { width:100%; border:none; border-top:1px solid var(--border); }

        /* ── Login ──────────────────────────────── */
        #login { position:fixed; inset:0; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:1000; }
        #login.hidden { display:none; }
        #login-card { background:var(--card); padding:36px; border-radius:14px; border:1px solid var(--border); box-shadow:0 16px 40px rgba(0,0,0,.15); text-align:center; width:100%; max-width:380px; }
        #login-card h2 { margin-bottom:20px; }
        #login input { width:80%; padding:10px 14px; margin-bottom:16px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:.95rem; }
        #login button { width:80%; padding:10px 14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:600; font-size:.95rem; cursor:pointer; transition:background .2s; }
        #login button:hover { background:var(--primary-h); }
        .hidden { display:none!important; }

        /* ── Flash animation ────────────────────── */
        @keyframes flash { 0%{background:rgba(59,130,246,.15)} 100%{background:transparent} }
        .updated { animation:flash 1s ease-out; }

        /* ── Trending ───────────────────────────── */
        .trend-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
        .trend-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; transition:all .2s; }
        .trend-card:hover { border-color:var(--primary); transform:translateY(-2px); }
        .trend-card h3 { font-size:.88rem; margin:0 0 10px; font-weight:500; line-height:1.35; }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="login">
        <div id="login-card">
            <form id="login-form">
                <h2>Access Dashboard</h2>
                <input type="password" id="password" placeholder="Enter Password" required>
                <button type="submit">Unlock</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <header>
            <div class="hdr-left">
                <h1>Prediction Markets</h1>
                <div class="timer-row">
                    <div class="pulse"></div>
                    <span>Auto refresh in <strong id="refresh-timer" style="color:var(--text)">15</strong>s</span>
                    <button class="btn-sm" onclick="forceRefresh()" id="refresh-btn" title="Refresh Now">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Refresh
                    </button>
                </div>
            </div>
            <div class="hdr-right">
                <span id="mode-text" style="font-size:.8rem;color:var(--muted);font-weight:500">Dark</span>
                <div class="toggle dark" id="theme-toggle"><div class="toggle-dot"></div></div>
            </div>
        </header>

        <!-- Summary -->
        <div class="summary">
            <div class="s-stat"><div class="s-label">Total Invested</div><div class="s-value" id="tot-inv">$0.00</div></div>
            <div class="s-stat"><div class="s-label">Current Value</div><div class="s-value" id="tot-val">$0.00</div></div>
            <div class="s-stat"><div class="s-label">Unrealized P/L</div><div class="s-value neutral" id="tot-pnl">$0.00 <span style="font-size:.9rem;opacity:.8">(0.00%)</span></div></div>
        </div>

        <!-- View Toggle -->
        <div class="view-bar">
            <button class="btn-sm active" id="btn-list" onclick="setView('list')">☰ List</button>
            <button class="btn-sm" id="btn-grid" onclick="setView('grid')">▦ Cards</button>
        </div>

        <div id="dashboard-content"></div>
    </div>

<script>
// ─── CONFIG ──────────────────────────────────────────────
const CORS_PROXY = 'https://corsproxy.io/?url=';

const portfolioConfig = [
    {
        category: "Cuba",
        markets: [
            { title:"Cuban Regime Falls in 2026?", slug:"cuban-regime-falls-in-2026", link:"https://polymarket.com/event/cuban-regime-falls-in-2026", shares:163.0, invested:55.42 }
        ]
    },
    {
        category: "Trump",
        markets: [
            { title:"Will Trump meet with Xi Jinping in March 2026?", slug:"will-trump-meet-with-xi-jinping-in-march-2026-241", link:"https://polymarket.com/event/who-will-trump-meet-with-in-march", shares:22.1, invested:7.07 },
            { title:'Will Trump say "Khamenei" this week? (March 22)', slug:"will-trump-say-khamenei-this-week-march-22", link:"https://polymarket.com/event/what-will-trump-say-this-week-march-22", shares:23.3, invested:10.00 }
        ]
    },
    {
        category: "Iran",
        markets: [
            { title:"Naim Qassem out as Hezbollah's secretary-general by March 31, 2026?", slug:"naim-qassem-out-as-hezbollahs-secretary-general-by-march-31-2026", link:"https://polymarket.com/event/naim-qassem-out-as-hezbollahs-secretary-general-by-december-31", shares:34.0, invested:10.00 },
            { title:"Iran x Israel/US conflict ends by April 15?", slug:"iran-x-israelus-conflict-ends-by-april-15-618", link:"https://polymarket.com/event/iran-x-israelus-conflict-ends-by", shares:30.3, invested:10.00 },
            { title:"Iran leadership change by March 31?", slug:"iran-leadership-change-by-march-31", link:"https://polymarket.com/event/iran-leadership-change-by", shares:58.8, invested:10.00 },
            { title:"Strait of Hormuz traffic returns to normal by end of April?", slug:"strait-of-hormuz-traffic-returns-to-normal-by-april-30", link:"https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-april-30", shares:27.1, invested:8.66 },
            { title:"Iran leadership change by April 30?", slug:"iran-leadership-change-by-april-30", link:"https://polymarket.com/event/iran-leadership-change-by", shares:19.3, invested:8.32 },
            { title:"Iran coup attempt by June 30?", slug:"iran-coup-attempt-by-june-30", link:"https://polymarket.com/event/iran-coup-attempt-by-june-30", shares:21.7, invested:5.00 },
            { title:"Iran leadership change by March 13?", slug:"iran-leadership-change-by-march-13", link:"https://polymarket.com/event/iran-leadership-change-by", shares:500.0, invested:1.00 }
        ]
    }
];

// ─── STATE ───────────────────────────────────────────────
let marketDataStore = {};
const TICK = 15;
let countdown = TICK;
let isFetching = false;
let currentView = 'list'; // 'list' or 'grid'

// ─── PROXY HELPER ────────────────────────────────────────
function proxiedUrl(url) {
    return CORS_PROXY + encodeURIComponent(url);
}

// ─── RENDER ──────────────────────────────────────────────
function render() {
    const root = document.getElementById('dashboard-content');
    root.innerHTML = '';
    if (currentView === 'list') renderListView(root);
    else renderGridView(root);

    // Trending section
    const trendBox = document.createElement('div');
    trendBox.id = 'trending-box';
    root.appendChild(trendBox);
    fetchTrending();
}

// --- LIST VIEW ---
function renderListView(root) {
    portfolioConfig.forEach(cat => {
        const sec = document.createElement('div');
        sec.className = 'category';
        const catId = 'cat-' + cat.category.replace(/\s/g,'');

        const hdr = document.createElement('div');
        hdr.className = 'cat-hdr';
        hdr.innerHTML = `<span class="arrow">▼</span><h2>${cat.category}</h2>`;
        hdr.onclick = () => {
            const body = document.getElementById(catId);
            body.classList.toggle('collapsed');
            hdr.querySelector('.arrow').style.transform = body.classList.contains('collapsed') ? 'rotate(-90deg)' : 'rotate(0)';
        };

        const body = document.createElement('div');
        body.id = catId;
        body.className = 'cat-body';

        cat.markets.forEach(m => {
            marketDataStore[m.slug] = m;
            const wrap = document.createElement('div');
            wrap.className = 'm-wrap';
            wrap.id = 'wrap-' + m.slug;

            const row = document.createElement('div');
            row.className = 'm-row';
            row.id = 'row-' + m.slug;
            row.dataset.market = m.slug;
            row.dataset.shares = m.shares;
            row.dataset.invested = m.invested;
            row.onclick = e => { if (!e.target.closest('.m-link')) wrap.classList.toggle('expanded'); };

            row.innerHTML = `
                <div class="m-info">
                    <h3 class="m-title">${m.title}</h3>
                    <a href="${m.link}" class="m-link" target="_blank">↗ View on Polymarket</a>
                </div>
                <div class="m-stats">
                    <div class="sg"><span class="sg-l">Shares</span><span class="sg-v">${m.shares.toFixed(1)}</span></div>
                    <div class="sg"><span class="sg-l">Invested</span><span class="sg-v">$${m.invested.toFixed(2)}</span></div>
                    <div class="sg"><span class="sg-l">Value</span><span class="sg-v current-value" style="color:var(--muted)">--</span></div>
                    <div class="pnl-box neutral"><span class="pnl-amt">--</span><span class="pnl-pct"></span></div>
                    <div class="exp-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
                </div>`;

            const exp = document.createElement('div');
            exp.className = 'm-expand';
            exp.innerHTML = `<iframe title="${m.title}" src="https://embed.polymarket.com/market?market=${m.slug}&theme=dark&creator=EthanB123&height=280" height="280" frameborder="0"></iframe>`;

            wrap.appendChild(row);
            wrap.appendChild(exp);
            body.appendChild(wrap);
        });

        sec.appendChild(hdr);
        sec.appendChild(body);
        root.appendChild(sec);
    });
}

// --- GRID / CARD VIEW ---
function renderGridView(root) {
    portfolioConfig.forEach(cat => {
        const sec = document.createElement('div');
        sec.className = 'category';

        const hdr = document.createElement('div');
        hdr.className = 'cat-hdr';
        hdr.innerHTML = `<h2>${cat.category}</h2>`;

        const grid = document.createElement('div');
        grid.className = 'card-grid';

        cat.markets.forEach(m => {
            marketDataStore[m.slug] = m;
            const cell = document.createElement('div');
            cell.className = 'card-cell';
            cell.id = 'card-' + m.slug;

            cell.innerHTML = `
                <div class="card-head">
                    <h3>${m.title}</h3>
                    <div class="card-stats">
                        Shares: <span>${m.shares.toFixed(1)}</span> · Invested: <span>$${m.invested.toFixed(2)}</span> ·
                        Value: <span class="current-value" style="color:var(--muted)">--</span>
                    </div>
                    <a href="${m.link}" class="m-link" target="_blank" style="margin-top:4px">↗ Polymarket</a>
                </div>
                <iframe title="${m.title}" src="https://embed.polymarket.com/market?market=${m.slug}&theme=dark&creator=EthanB123&height=240" height="240" frameborder="0"></iframe>`;

            // We also need data attributes for price updates
            const fakeRow = document.createElement('div');
            fakeRow.className = 'm-row';
            fakeRow.id = 'row-' + m.slug;
            fakeRow.dataset.market = m.slug;
            fakeRow.dataset.shares = m.shares;
            fakeRow.dataset.invested = m.invested;
            fakeRow.style.display = 'none';
            cell.appendChild(fakeRow);

            grid.appendChild(cell);
        });

        sec.appendChild(hdr);
        sec.appendChild(grid);
        root.appendChild(sec);
    });
}

function setView(v) {
    currentView = v;
    document.getElementById('btn-list').classList.toggle('active', v === 'list');
    document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
    render();
    updateLivePrices();
}

// ─── TRENDING GEOPOLITICS ────────────────────────────────
async function fetchTrending() {
    try {
        const res = await fetch(proxiedUrl('https://gamma-api.polymarket.com/events?limit=50&active=true&closed=false'));
        const data = await res.json();
        const items = [];
        for (const ev of data) {
            const tags = (ev.tags||[]).map(t => (typeof t==='object'?t.label||t.id:t).toLowerCase());
            const slug = (ev.slug||'').toLowerCase();
            const title = (ev.title||'').toLowerCase();
            const isGeo = tags.some(t=>['geopolitics','middle east','global politics','politics'].includes(t))
                       || slug.includes('geopolitics') || title.includes('war') || title.includes('election');
            if (isGeo && ev.markets && ev.markets.length) {
                const mk = ev.markets[0];
                if (!marketDataStore[mk.slug]) items.push({ title:ev.title, link:`https://polymarket.com/event/${ev.slug}` });
            }
            if (items.length >= 4) break;
        }
        if (!items.length) return;
        const box = document.getElementById('trending-box');
        box.innerHTML = `<div class="category"><div class="cat-hdr"><h2>📈 Trending Geopolitics</h2></div><div class="trend-grid" id="trend-grid"></div></div>`;
        const grid = document.getElementById('trend-grid');
        items.forEach(i => {
            const c = document.createElement('div');
            c.className = 'trend-card';
            c.innerHTML = `<h3>${i.title}</h3><a href="${i.link}" class="m-link" target="_blank" style="margin-top:8px;align-self:flex-start">Explore →</a>`;
            grid.appendChild(c);
        });
    } catch(e) { console.error('Trending fetch error', e); }
}

// ─── AUTH ────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    if (document.getElementById('password').value === 'IWonULoseBro7') {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        render();
        updateLivePrices();
        startTimer();
    } else { alert('Incorrect password.'); document.getElementById('password').value=''; }
});

// Theme toggle
const toggle = document.getElementById('theme-toggle');
toggle.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    toggle.classList.toggle('dark');
    document.getElementById('mode-text').textContent = document.body.classList.contains('light-mode') ? 'Light' : 'Dark';
});

// ─── LIVE PRICES ─────────────────────────────────────────
function startTimer() {
    setInterval(() => {
        countdown--;
        if (countdown <= 0) updateLivePrices();
        document.getElementById('refresh-timer').textContent = Math.max(0, countdown);
    }, 1000);
}

function forceRefresh() {
    if (isFetching) return;
    countdown = TICK;
    document.getElementById('refresh-timer').textContent = countdown;
    updateLivePrices();
}

async function updateLivePrices() {
    if (isFetching) return;
    isFetching = true;
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');

    const rows = document.querySelectorAll('.m-row[data-invested]');
    let totInv = 0, totVal = 0;

    const results = await Promise.all(Array.from(rows).map(async row => {
        const slug = row.dataset.market;
        const shares = parseFloat(row.dataset.shares);
        const invested = parseFloat(row.dataset.invested);
        if (!slug || !shares || !invested) return null;

        try {
            const apiUrl = `https://gamma-api.polymarket.com/markets?slug=${slug}`;
            const res = await fetch(proxiedUrl(apiUrl));
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            let market = null;
            if (Array.isArray(data) && data.length) market = data[0];
            else if (data && !Array.isArray(data) && data.outcomePrices) market = data;

            let price = null;
            if (market) {
                if (market.outcomePrices) {
                    try {
                        const pp = typeof market.outcomePrices === 'string' ? JSON.parse(market.outcomePrices) : market.outcomePrices;
                        price = parseFloat(pp[0]);
                    } catch(e){}
                }
                if (price === null || isNaN(price)) price = parseFloat(market.lastTradePrice);
            }

            if (price !== null && !isNaN(price)) {
                row.classList.remove('updated'); void row.offsetWidth; row.classList.add('updated');
                return { row, price, shares, invested };
            }
        } catch(err) { console.error('Fetch fail ' + slug, err); }
        return { row, price:null, shares, invested };
    }));

    results.forEach(r => {
        if (!r) return;
        totInv += r.invested;
        if (r.price !== null) totVal += applyPnl(r.row, r.price, r.shares, r.invested);
        else totVal += r.invested;
    });

    updateSummary(totInv, totVal);
    isFetching = false;
    countdown = TICK;
    document.getElementById('refresh-timer').textContent = countdown;
    btn.classList.remove('spinning');
}

function applyPnl(row, price, shares, invested) {
    const val = shares * price;
    const pnl = val - invested;
    const pct = invested > 0 ? (pnl / invested) * 100 : 0;

    // Update value in both list and grid views
    const slug = row.dataset.market;

    // List view
    const cvEl = row.querySelector('.current-value');
    if (cvEl) { cvEl.textContent = '$' + val.toFixed(2); cvEl.style.color = 'inherit'; }

    const pnlAmt = row.querySelector('.pnl-amt');
    const pnlPct = row.querySelector('.pnl-pct');
    const pnlBox = row.querySelector('.pnl-box');
    if (pnlAmt) pnlAmt.textContent = (pnl >= 0 ? '+' : '') + '$' + Math.abs(pnl).toFixed(2);
    if (pnlPct) pnlPct.textContent = '(' + (pct >= 0 ? '+' : '') + Math.abs(pct).toFixed(1) + '%)';
    if (pnlBox) { pnlBox.classList.remove('positive','negative','neutral'); pnlBox.classList.add(pnl > .01 ? 'positive' : pnl < -.01 ? 'negative' : 'neutral'); }

    // Grid view — update .current-value inside card-cell parent
    const card = document.getElementById('card-' + slug);
    if (card) {
        const cv2 = card.querySelector('.card-head .current-value');
        if (cv2) { cv2.textContent = '$' + val.toFixed(2); cv2.style.color = pnl > .01 ? 'var(--pos)' : pnl < -.01 ? 'var(--neg)' : 'inherit'; }
    }

    return val;
}

function updateSummary(inv, val) {
    const pnl = val - inv;
    const pct = inv > 0 ? (pnl / inv) * 100 : 0;
    const sign = pnl >= 0 ? '+' : '';
    document.getElementById('tot-inv').textContent = '$' + inv.toFixed(2);
    document.getElementById('tot-val').textContent = '$' + val.toFixed(2);
    const el = document.getElementById('tot-pnl');
    el.innerHTML = sign + '$' + Math.abs(pnl).toFixed(2) + ' <span style="font-size:.9rem;opacity:.8">(' + sign + Math.abs(pct).toFixed(2) + '%)</span>';
    el.className = 's-value ' + (pnl > .01 ? 'positive' : pnl < -.01 ? 'negative' : 'neutral');
}
</script>
