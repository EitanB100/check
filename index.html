<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Prediction Markets Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0b0f19;--text:#e2e8f0;--card:#151b2b;--card-exp:#1a2235;--border:#1f2937;
            --primary:#3b82f6;--primary-h:#2563eb;
            --pos:#10b981;--pos-bg:rgba(16,185,129,.1);
            --neg:#ef4444;--neg-bg:rgba(239,68,68,.1);
            --muted:#94a3b8;--muted-bg:rgba(148,163,184,.1);
        }
        .light-mode {
            --bg:#f8fafc;--text:#0f172a;--card:#fff;--card-exp:#f1f5f9;--border:#e2e8f0;
            --primary:#2563eb;--primary-h:#1d4ed8;
            --pos:#16a34a;--pos-bg:rgba(22,163,74,.1);
            --neg:#dc2626;--neg-bg:rgba(220,38,38,.1);
            --muted:#64748b;--muted-bg:rgba(100,116,139,.1);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:24px;transition:background .3s,color .3s}

        /* Header */
        header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
        .hdr-left h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
        .timer-row{font-size:.82rem;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:10px}
        .pulse{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(59,130,246,.7)}70%{transform:scale(1);box-shadow:0 0 0 6px rgba(59,130,246,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(59,130,246,0)}}
        .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:6px;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s;font-family:inherit}
        .btn-sm:hover{background:var(--border)}
        .btn-sm.spinning svg{animation:spin 1s linear infinite}
        @keyframes spin{100%{transform:rotate(360deg)}}
        .hdr-right{display:flex;align-items:center;gap:14px}
        .toggle{width:44px;height:24px;background:var(--border);border-radius:24px;position:relative;cursor:pointer;transition:background .3s}
        .toggle.dark{background:var(--primary)}
        .toggle-dot{position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .3s}
        .toggle.dark .toggle-dot{transform:translateX(20px)}

        /* Summary */
        .summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:28px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .s-stat{text-align:center;padding:6px 14px}
        .s-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px}
        .s-value{font-size:1.8rem;font-weight:700;letter-spacing:-.02em}

        /* View toggle */
        .view-bar{display:flex;justify-content:flex-end;margin-bottom:16px;gap:8px}
        .view-bar .btn-sm.active{background:var(--primary);color:#fff;border-color:var(--primary)}

        /* Category */
        .category{margin-bottom:28px}
        .cat-hdr{cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:6px 10px;border-radius:8px;transition:background .2s}
        .cat-hdr:hover{background:rgba(255,255,255,.05)}
        .light-mode .cat-hdr:hover{background:rgba(0,0,0,.04)}
        .cat-hdr h2{font-size:1.15rem;font-weight:600}
        .arrow{transition:transform .3s;font-size:.8rem;color:var(--muted)}
        .cat-body{display:flex;flex-direction:column;gap:14px}
        .cat-body.collapsed{display:none}

        /* List view market row */
        .m-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .m-wrap:hover{border-color:var(--primary)}
        .m-row{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .m-info{flex:1;padding-right:20px}
        .m-title{font-size:.98rem;font-weight:600;margin:0 0 6px;line-height:1.35}
        .m-link{font-size:.75rem;color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:500;padding:3px 7px;border-radius:4px;background:rgba(59,130,246,.1);transition:background .2s}
        .m-link:hover{background:rgba(59,130,246,.2)}
        .m-stats{display:flex;gap:24px;align-items:center}
        .sg{display:flex;flex-direction:column;gap:3px;min-width:75px}
        .sg-l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
        .sg-v{font-size:.92rem;font-weight:600}
        .pnl-box{padding:5px 10px;border-radius:7px;font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:flex-end;min-width:90px}
        .pnl-amt{font-size:1rem}
        .pnl-pct{font-size:.7rem;opacity:.9}
        .positive{background:var(--pos-bg);color:var(--pos)}
        .negative{background:var(--neg-bg);color:var(--neg)}
        .neutral{background:var(--muted-bg);color:var(--muted)}
        .exp-icon{margin-left:16px;color:var(--muted);transition:transform .3s}
        .m-wrap.expanded .exp-icon{transform:rotate(180deg)}
        .m-expand{background:var(--card-exp);border-top:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .4s ease-out,padding .4s ease;display:flex;justify-content:center}
        .m-wrap.expanded .m-expand{max-height:360px;padding:16px}
        .m-expand iframe{border-radius:8px;max-width:580px;width:100%}

        /* Card / Grid view — one flat grid, no category rows */
        .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:28px}
        .card-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
        .card-cell:hover{border-color:var(--primary)}
        .card-cell .card-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
        .card-cell .card-stats{font-size:.75rem;color:var(--muted);display:flex;gap:6px;flex-wrap:nowrap;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card-cell .card-stats span{font-weight:600;color:var(--text)}
        .card-cell iframe{width:100%;border:none;display:block}

        /* Login */
        #login{position:fixed;inset:0;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:1000}
        #login.hidden{display:none}
        #login-card{background:var(--card);padding:36px;border-radius:14px;border:1px solid var(--border);box-shadow:0 16px 40px rgba(0,0,0,.15);text-align:center;width:100%;max-width:380px}
        #login-card h2{margin-bottom:20px}
        #login input{width:80%;padding:10px 14px;margin-bottom:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem}
        #login button{width:80%;padding:10px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .2s}
        #login button:hover{background:var(--primary-h)}
        .hidden{display:none!important}

        @keyframes flash{0%{background:rgba(59,130,246,.15)}100%{background:transparent}}
        .updated{animation:flash 1s ease-out}

        /* Trending — Enhanced */
        .trend-section{margin-top:32px}
        .trend-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
        .trend-tab{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:20px;font-size:.78rem;cursor:pointer;font-family:inherit;font-weight:500;transition:all .2s}
        .trend-tab:hover{color:var(--text);border-color:var(--muted)}
        .trend-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
        .trend-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;transition:all .2s;position:relative;overflow:hidden}
        .trend-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
        .trend-card h3{font-size:.92rem;margin:0 0 10px;font-weight:600;line-height:1.35}
        .trend-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:.75rem;color:var(--muted)}
        .trend-meta .tm{display:flex;flex-direction:column;gap:2px}
        .trend-meta .tm-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
        .trend-meta .tm-value{font-weight:700;color:var(--text);font-size:.85rem}
        .trend-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
        .trend-tag{font-size:.65rem;padding:2px 8px;border-radius:10px;background:var(--muted-bg);color:var(--muted);font-weight:500}
        .trend-context{font-size:.78rem;color:var(--muted);line-height:1.5;max-height:0;overflow:hidden;transition:max-height .4s ease}
        .trend-card.open .trend-context{max-height:400px}
        .trend-toggle{font-size:.72rem;color:var(--primary);cursor:pointer;margin-top:8px;font-weight:600;display:inline-flex;align-items:center;gap:4px;background:none;border:none;font-family:inherit;padding:0}
        .trend-toggle:hover{text-decoration:underline}
        .trend-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    </style>
</head>
<body>
    <div id="login">
        <div id="login-card">
            <form id="login-form">
                <h2>Access Dashboard</h2>
                <input type="password" id="password" placeholder="Enter Password" required>
                <input type="text" id="wallet-input" placeholder="Wallet address (0x…) — optional" style="font-size:.82rem">
                <p style="font-size:.7rem;color:var(--muted);margin:-8px 0 12px;opacity:.8">Enter your Polymarket wallet to auto-sync positions.<br>Stored locally in your browser only — never uploaded.</p>
                <button type="submit">Unlock</button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <header>
            <div class="hdr-left">
                <h1>Prediction Markets</h1>
                <div class="timer-row">
                    <div class="pulse"></div>
                    <span>Auto refresh in <strong id="refresh-timer" style="color:var(--text)">15</strong>s</span>
                    <button class="btn-sm" onclick="forceRefresh()" id="refresh-btn" title="Refresh Now">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Refresh
                    </button>
                </div>
            </div>
            <div class="hdr-right">
                <span id="mode-text" style="font-size:.8rem;color:var(--muted);font-weight:500">Dark</span>
                <div class="toggle dark" id="theme-toggle"><div class="toggle-dot"></div></div>
            </div>
        </header>

        <div class="summary">
            <div class="s-stat"><div class="s-label">Total Invested</div><div class="s-value" id="tot-inv">$0.00</div></div>
            <div class="s-stat"><div class="s-label">Current Value</div><div class="s-value" id="tot-val">$0.00</div></div>
            <div class="s-stat"><div class="s-label">Unrealized P/L</div><div class="s-value neutral" id="tot-pnl">$0.00 <span style="font-size:.9rem;opacity:.8">(0.00%)</span></div></div>
        </div>

        <div class="view-bar">
            <button class="btn-sm active" id="btn-list" onclick="setView('list')">☰ List</button>
            <button class="btn-sm" id="btn-grid" onclick="setView('grid')">▦ Cards</button>
        </div>

        <div id="dashboard-content"></div>
    </div>

<script>
// ─── CORS PROXIES (fallback chain) ───────────────────────
const PROXIES = [
    url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
    url => 'https://corsproxy.io/?' + encodeURIComponent(url),
    url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
];
let activeProxyIdx = 0;

async function proxyFetch(url) {
    // Try proxies in order; on failure rotate to next
    for (let attempt = 0; attempt < PROXIES.length; attempt++) {
        const idx = (activeProxyIdx + attempt) % PROXIES.length;
        const proxied = PROXIES[idx](url);
        try {
            const res = await fetch(proxied);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            activeProxyIdx = idx; // stick with working proxy
            return data;
        } catch(e) {
            console.warn(`Proxy ${idx} failed for ${url}:`, e.message);
        }
    }
    throw new Error('All proxies failed for ' + url);
}

// ─── CONFIG ──────────────────────────────────────────────
// outcome: 0 = YES shares, 1 = NO shares
const FALLBACK_CONFIG = [
    {
        category: "Cuba",
        markets: [
            { title:"Cuban Regime Falls in 2026?", slug:"cuban-regime-falls-in-2026", link:"https://polymarket.com/event/cuban-regime-falls-in-2026", shares:163.0, invested:55.42, outcome:0 }
        ]
    },
    {
        category: "Trump",
        markets: [
            { title:"Will Trump meet with Xi Jinping in March 2026?", slug:"will-trump-meet-with-xi-jinping-in-march-2026-241", link:"https://polymarket.com/event/who-will-trump-meet-with-in-march", shares:22.1, invested:7.07, outcome:1 },
            { title:'Will Trump say "Khamenei" this week? (March 22)', slug:"will-trump-say-khamenei-this-week-march-22", link:"https://polymarket.com/event/what-will-trump-say-this-week-march-22", shares:23.3, invested:10.00, outcome:0 }
        ]
    },
    {
        category: "Iran",
        markets: [
            { title:"Naim Qassem out as Hezbollah's secretary-general by March 31, 2026?", slug:"naim-qassem-out-as-hezbollahs-secretary-general-by-march-31-2026", link:"https://polymarket.com/event/naim-qassem-out-as-hezbollahs-secretary-general-by-december-31", shares:34.0, invested:10.00, outcome:0 },
            { title:"Iran x Israel/US conflict ends by April 15?", slug:"iran-x-israelus-conflict-ends-by-april-15-618", link:"https://polymarket.com/event/iran-x-israelus-conflict-ends-by", shares:30.3, invested:10.00, outcome:0 },
            { title:"Iran leadership change by March 31?", slug:"iran-leadership-change-by-march-31", link:"https://polymarket.com/event/iran-leadership-change-by", shares:58.8, invested:10.00, outcome:0 },
            { title:"Strait of Hormuz traffic returns to normal by end of April?", slug:"strait-of-hormuz-traffic-returns-to-normal-by-april-30", link:"https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-april-30", shares:27.1, invested:8.66, outcome:0 },
            { title:"Iran leadership change by April 30?", slug:"iran-leadership-change-by-april-30", link:"https://polymarket.com/event/iran-leadership-change-by", shares:19.3, invested:8.32, outcome:0 },
            { title:"Iran coup attempt by June 30?", slug:"iran-coup-attempt-by-june-30", link:"https://polymarket.com/event/iran-coup-attempt-by-june-30", shares:21.7, invested:5.00, outcome:0 },
            { title:"Iran leadership change by March 13?", slug:"iran-leadership-change-by-march-13", link:"https://polymarket.com/event/iran-leadership-change-by", shares:500.0, invested:1.00, outcome:0 }
        ]
    }
];

let portfolioConfig = FALLBACK_CONFIG;
let walletAddress = localStorage.getItem('pm_wallet') || '';

// Fetch live positions from Polymarket Data API
async function fetchPositions() {
    if (!walletAddress) return false;
    try {
        const data = await proxyFetch('https://data-api.polymarket.com/positions?user=' + walletAddress);
        if (!data || !Array.isArray(data) || data.length === 0) {
            console.warn('No positions found for wallet', walletAddress);
            return false;
        }
        console.log('Fetched', data.length, 'positions from Data API');

        // Group by eventSlug
        const catMap = {};
        for (const pos of data) {
            const size = parseFloat(pos.size || 0);
            if (size <= 0.01) continue; // skip dust

            const slug = pos.slug || '';
            const title = pos.title || slug;
            const eventSlug = pos.eventSlug || '';
            const outcomeIdx = pos.outcomeIndex ?? (pos.outcome === 'No' ? 1 : 0);
            const invested = parseFloat(pos.initialValue || 0);

            // Derive a readable category from eventSlug
            const catName = eventSlug.split('-').slice(0, 3).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') || 'Portfolio';

            if (!catMap[catName]) catMap[catName] = [];
            catMap[catName].push({
                title: title,
                slug: slug,
                link: 'https://polymarket.com/event/' + eventSlug,
                shares: size,
                invested: Math.abs(invested),
                outcome: outcomeIdx
            });
        }

        portfolioConfig = Object.entries(catMap).map(([cat, markets]) => ({
            category: cat,
            markets: markets
        }));

        return true;
    } catch(e) {
        console.error('Failed to fetch positions:', e);
        return false;
    }
}

// ─── STATE ───────────────────────────────────────────────
let marketDataStore = {};
const TICK = 15;
let countdown = TICK;
let isFetching = false;
let currentView = 'list';

// ─── RENDER ──────────────────────────────────────────────
function render() {
    const root = document.getElementById('dashboard-content');
    root.innerHTML = '';
    marketDataStore = {};
    if (currentView === 'list') renderList(root);
    else renderGrid(root);
    // Trending
    const tb = document.createElement('div'); tb.id = 'trending-box'; root.appendChild(tb);
    fetchTrending();
}

// ── LIST VIEW ────────────────────────────────────────────
function renderList(root) {
    portfolioConfig.forEach(cat => {
        const sec = document.createElement('div'); sec.className = 'category';
        const catId = 'cat-' + cat.category.replace(/\s/g,'');
        const hdr = document.createElement('div'); hdr.className = 'cat-hdr';
        hdr.innerHTML = `<span class="arrow">▼</span><h2>${cat.category}</h2>`;
        hdr.onclick = () => {
            const b = document.getElementById(catId);
            b.classList.toggle('collapsed');
            hdr.querySelector('.arrow').style.transform = b.classList.contains('collapsed') ? 'rotate(-90deg)' : 'rotate(0)';
        };
        const body = document.createElement('div'); body.id = catId; body.className = 'cat-body';

        cat.markets.forEach(m => {
            marketDataStore[m.slug] = m;
            const wrap = document.createElement('div'); wrap.className = 'm-wrap'; wrap.id = 'wrap-'+m.slug;
            const row = document.createElement('div'); row.className = 'm-row'; row.id = 'row-'+m.slug;
            row.dataset.market = m.slug; row.dataset.shares = m.shares; row.dataset.invested = m.invested; row.dataset.outcome = m.outcome || 0;
            row.onclick = e => { if (!e.target.closest('.m-link')) wrap.classList.toggle('expanded'); };
            const badge = m.outcome === 1 ? '<span style="font-size:.65rem;padding:2px 6px;border-radius:4px;background:var(--neg-bg);color:var(--neg);margin-left:8px;font-weight:600">NO</span>' : '<span style="font-size:.65rem;padding:2px 6px;border-radius:4px;background:var(--pos-bg);color:var(--pos);margin-left:8px;font-weight:600">YES</span>';
            row.innerHTML = `
                <div class="m-info">
                    <h3 class="m-title">${m.title}${badge}</h3>
                    <a href="${m.link}" class="m-link" target="_blank">↗ View on Polymarket</a>
                </div>
                <div class="m-stats">
                    <div class="sg"><span class="sg-l">Shares</span><span class="sg-v">${m.shares.toFixed(1)}</span></div>
                    <div class="sg"><span class="sg-l">Invested</span><span class="sg-v">$${m.invested.toFixed(2)}</span></div>
                    <div class="sg"><span class="sg-l">Value</span><span class="sg-v current-value" style="color:var(--muted)">--</span></div>
                    <div class="pnl-box neutral"><span class="pnl-amt">--</span><span class="pnl-pct"></span></div>
                    <div class="exp-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
                </div>`;
            const exp = document.createElement('div'); exp.className = 'm-expand';
            exp.innerHTML = `<iframe title="${m.title}" src="https://embed.polymarket.com/market?market=${m.slug}&theme=dark&creator=EthanB123&height=280" height="280" frameborder="0" scrolling="no" style="overflow:hidden"></iframe>`;
            wrap.appendChild(row); wrap.appendChild(exp); body.appendChild(wrap);
        });
        sec.appendChild(hdr); sec.appendChild(body); root.appendChild(sec);
    });
}

// ── GRID / CARD VIEW — flat grid, no category rows, no duplicate title ──
function renderGrid(root) {
    const grid = document.createElement('div'); grid.className = 'card-grid';

    portfolioConfig.forEach(cat => {
        cat.markets.forEach(m => {
            marketDataStore[m.slug] = m;
            const cell = document.createElement('div'); cell.className = 'card-cell'; cell.id = 'card-'+m.slug;
            // Only stats bar — NO title (embed already shows it)
            cell.innerHTML = `
                <div class="card-head">
                    <div class="card-stats">
                        Shares: <span>${m.shares.toFixed(1)}</span> · Inv: <span>$${m.invested.toFixed(2)}</span> · Current Value: <span class="current-value" style="color:var(--muted)">--</span> · <span class="card-pnl" style="font-weight:600">--</span>
                    </div>
                    <a href="${m.link}" class="m-link" target="_blank">↗ Polymarket</a>
                </div>
                <iframe title="${m.title}" src="https://embed.polymarket.com/market?market=${m.slug}&theme=dark&creator=EthanB123&height=280" height="280" frameborder="0" scrolling="no" style="overflow:hidden"></iframe>`;
            // Hidden row for price update logic
            const fakeRow = document.createElement('div'); fakeRow.className = 'm-row'; fakeRow.id = 'row-'+m.slug;
            fakeRow.dataset.market = m.slug; fakeRow.dataset.shares = m.shares; fakeRow.dataset.invested = m.invested; fakeRow.dataset.outcome = m.outcome || 0;
            fakeRow.style.display = 'none';
            cell.appendChild(fakeRow);
            grid.appendChild(cell);
        });
    });
    root.appendChild(grid);
}

function setView(v) {
    currentView = v;
    document.getElementById('btn-list').classList.toggle('active', v === 'list');
    document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
    render();
    updateLivePrices();
}

// ─── ENHANCED TRENDING ───────────────────────────────────
const TREND_CATEGORIES = {
    'All': null,
    'Geopolitics': ['geopolitics','middle east','israel','iran','war','conflict','military','nato','sanctions'],
    'Politics': ['politics','elections','trump','congress','government','legislation','policy'],
    'Crypto': ['crypto','bitcoin','ethereum','defi','blockchain','solana','nft'],
    'Sports': ['sports','nba','nfl','soccer','football','tennis','mma','fifa','world cup','baseball','f1'],
    'Science': ['science','ai','technology','space','climate','energy'],
};
let trendData = []; // cached
let activeTrendCat = 'All';

async function fetchTrending() {
    try {
        // Fetch high-volume active events, sorted by 24h volume
        const data = await proxyFetch('https://gamma-api.polymarket.com/events?limit=100&active=true&closed=false&_t=' + Date.now());
        
        trendData = [];
        for (const ev of data) {
            if (!ev.markets || !ev.markets.length) continue;
            // Skip markets already in portfolio
            const mainMarket = ev.markets[0];
            if (marketDataStore[mainMarket.slug]) continue;

            const tags = (ev.tags||[]).map(t => (typeof t === 'object' ? (t.label||t.slug||t.id).toLowerCase() : String(t).toLowerCase()));
            
            // Parse market data
            let yesPrice = null;
            if (mainMarket.outcomePrices) {
                try {
                    const pp = typeof mainMarket.outcomePrices === 'string' ? JSON.parse(mainMarket.outcomePrices) : mainMarket.outcomePrices;
                    yesPrice = parseFloat(pp[0]);
                } catch(e){}
            }
            if (yesPrice === null) yesPrice = parseFloat(mainMarket.lastTradePrice || 0);

            const vol24h = parseFloat(ev.volume24hr || mainMarket.volume24hr || 0);
            const volTotal = parseFloat(ev.volume || mainMarket.volume || 0);
            const spread = parseFloat(mainMarket.spread || 0);
            const bestBid = parseFloat(mainMarket.bestBid || 0);
            const bestAsk = parseFloat(mainMarket.bestAsk || 0);

            // Context from eventMetadata
            let context = '';
            if (ev.eventMetadata && ev.eventMetadata.context_description) {
                context = ev.eventMetadata.context_description;
            }

            trendData.push({
                title: ev.title,
                slug: ev.slug,
                link: 'https://polymarket.com/event/' + ev.slug,
                tags: tags,
                yesPrice: yesPrice,
                vol24h: vol24h,
                volTotal: volTotal,
                spread: spread,
                bestBid: bestBid,
                bestAsk: bestAsk,
                endDate: mainMarket.endDate || ev.endDate,
                context: context,
            });
        }

        // Sort by 24h volume descending
        trendData.sort((a, b) => b.vol24h - a.vol24h);

        renderTrending();
    } catch(e) { console.error('Trending fetch error', e); }
}

function renderTrending() {
    const box = document.getElementById('trending-box');
    if (!trendData.length) { box.innerHTML = ''; return; }

    // Filter by active category
    let filtered = trendData;
    const catTags = TREND_CATEGORIES[activeTrendCat];
    if (catTags) {
        filtered = trendData.filter(d => d.tags.some(t => catTags.some(ct => t.includes(ct))));
    }
    // Take top 8
    filtered = filtered.slice(0, 8);

    // Build HTML
    let tabsHtml = Object.keys(TREND_CATEGORIES).map(cat =>
        `<button class="trend-tab${cat === activeTrendCat ? ' active' : ''}" onclick="setTrendCat('${cat}')">${cat}</button>`
    ).join('');

    let cardsHtml = filtered.map((d, idx) => {
        const pricePct = (d.yesPrice * 100).toFixed(0);
        const vol24hFmt = d.vol24h >= 1000 ? '$' + (d.vol24h / 1000).toFixed(1) + 'k' : '$' + d.vol24h.toFixed(0);
        const volTotalFmt = d.volTotal >= 1000000 ? '$' + (d.volTotal / 1000000).toFixed(2) + 'M' : d.volTotal >= 1000 ? '$' + (d.volTotal / 1000).toFixed(1) + 'k' : '$' + d.volTotal.toFixed(0);
        const spreadFmt = (d.spread * 100).toFixed(1) + '¢';
        const endFmt = d.endDate ? new Date(d.endDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '—';

        const tagsHtml = d.tags.slice(0, 4).map(t => `<span class="trend-tag">${t}</span>`).join('');

        const contextSnippet = d.context ? d.context.substring(0, 180) + (d.context.length > 180 ? '...' : '') : '';
        const hasContext = d.context.length > 0;

        return `
        <div class="trend-card" id="trend-${idx}">
            <h3>${d.title}</h3>
            <div class="trend-tags">${tagsHtml}</div>
            <div class="trend-meta">
                <div class="tm"><span class="tm-label">YES Price</span><span class="tm-value" style="color:${d.yesPrice > 0.5 ? 'var(--pos)' : 'var(--neg)'}">${pricePct}¢</span></div>
                <div class="tm"><span class="tm-label">24h Vol</span><span class="tm-value">${vol24hFmt}</span></div>
                <div class="tm"><span class="tm-label">Total Vol</span><span class="tm-value">${volTotalFmt}</span></div>
                <div class="tm"><span class="tm-label">Spread</span><span class="tm-value">${spreadFmt}</span></div>
                <div class="tm"><span class="tm-label">Ends</span><span class="tm-value">${endFmt}</span></div>
            </div>
            ${hasContext ? `
                <div class="trend-context" id="ctx-${idx}"><em style="display:block;margin-bottom:6px;font-size:.7rem;color:var(--muted);opacity:.7">⚠ Analysis by Polymarket — may reference historical context</em>${d.context}</div>
                <button class="trend-toggle" onclick="toggleCtx(${idx})">📊 Show Analysis <span id="ctx-arrow-${idx}">▼</span></button>
            ` : ''}
            <div class="trend-card-footer">
                <a href="${d.link}" class="m-link" target="_blank">↗ Open Market</a>
            </div>
        </div>`;
    }).join('');

    box.innerHTML = `
        <div class="trend-section">
            <div class="cat-hdr" style="cursor:default"><h2>📈 Trending Markets</h2></div>
            <div class="trend-tabs">${tabsHtml}</div>
            <div class="trend-grid">${cardsHtml}</div>
        </div>`;
}

function setTrendCat(cat) {
    activeTrendCat = cat;
    renderTrending();
}

function toggleCtx(idx) {
    const card = document.getElementById('trend-' + idx);
    const arrow = document.getElementById('ctx-arrow-' + idx);
    card.classList.toggle('open');
    arrow.textContent = card.classList.contains('open') ? '▲' : '▼';
}

// ─── LIVE PRICES ─────────────────────────────────────────
function startTimer() {
    setInterval(() => {
        countdown--;
        if (countdown <= 0) updateLivePrices();
        document.getElementById('refresh-timer').textContent = Math.max(0, countdown);
    }, 1000);
}
function forceRefresh() {
    if (isFetching) return;
    countdown = TICK; document.getElementById('refresh-timer').textContent = countdown;
    updateLivePrices();
}

async function updateLivePrices() {
    if (isFetching) return;
    isFetching = true;
    const btn = document.getElementById('refresh-btn'); btn.classList.add('spinning');

    const rows = document.querySelectorAll('.m-row[data-invested]');
    let totInv = 0, totVal = 0;

    const results = await Promise.all(Array.from(rows).map(async row => {
        const slug = row.dataset.market;
        const shares = parseFloat(row.dataset.shares);
        const invested = parseFloat(row.dataset.invested);
        if (!slug || !shares || !invested) return null;

        try {
            const data = await proxyFetch('https://gamma-api.polymarket.com/markets?slug=' + slug + '&_t=' + Date.now());

            let market = null;
            if (Array.isArray(data) && data.length) market = data[0];
            else if (data && !Array.isArray(data) && (data.outcomePrices || data.lastTradePrice)) market = data;

            let price = null;
            const outcomeIdx = parseInt(row.dataset.outcome) || 0;
            if (market) {
                // Priority 1: use bestBid/bestAsk midpoint (most real-time)
                const bid = parseFloat(market.bestBid);
                const ask = parseFloat(market.bestAsk);
                if (!isNaN(bid) && !isNaN(ask) && bid > 0 && ask > 0) {
                    const yesMid = (bid + ask) / 2;
                    price = outcomeIdx === 1 ? (1 - yesMid) : yesMid;
                }
                // Priority 2: outcomePrices array
                if (price === null || isNaN(price)) {
                    if (market.outcomePrices) {
                        try {
                            const pp = typeof market.outcomePrices === 'string' ? JSON.parse(market.outcomePrices) : market.outcomePrices;
                            price = parseFloat(pp[outcomeIdx]);
                        } catch(e){}
                    }
                }
                // Priority 3: lastTradePrice
                if (price === null || isNaN(price)) {
                    const ltp = parseFloat(market.lastTradePrice);
                    price = outcomeIdx === 1 ? (1 - ltp) : ltp;
                }
            }
            if (price !== null && !isNaN(price)) {
                row.classList.remove('updated'); void row.offsetWidth; row.classList.add('updated');
                return { row, price, shares, invested };
            }
        } catch(err) { console.error('Fetch fail ' + slug, err); }
        return { row, price:null, shares, invested };
    }));

    results.forEach(r => {
        if (!r) return;
        totInv += r.invested;
        if (r.price !== null) totVal += applyPnl(r.row, r.price, r.shares, r.invested);
        else totVal += r.invested;
    });
    updateSummary(totInv, totVal);

    isFetching = false;
    countdown = TICK; document.getElementById('refresh-timer').textContent = countdown;
    btn.classList.remove('spinning');
}

function applyPnl(row, price, shares, invested) {
    const val = shares * price, pnl = val - invested;
    const pct = invested > 0 ? (pnl / invested) * 100 : 0;
    const slug = row.dataset.market;

    // List view elements
    const cv = row.querySelector('.current-value');
    if (cv) { cv.textContent = '$'+val.toFixed(2); cv.style.color = 'inherit'; }
    const pa = row.querySelector('.pnl-amt'), pp = row.querySelector('.pnl-pct'), pb = row.querySelector('.pnl-box');
    if (pa) pa.textContent = (pnl>=0?'+':'')+' $'+Math.abs(pnl).toFixed(2);
    if (pp) pp.textContent = '('+(pct>=0?'+':'')+Math.abs(pct).toFixed(1)+'%)';
    if (pb) { pb.classList.remove('positive','negative','neutral'); pb.classList.add(pnl>.01?'positive':pnl<-.01?'negative':'neutral'); }

    // Grid view elements
    const card = document.getElementById('card-'+slug);
    if (card) {
        const cv2 = card.querySelector('.card-head .current-value');
        if (cv2) { cv2.textContent = '$'+val.toFixed(2); cv2.style.color = pnl>.01?'var(--pos)':pnl<-.01?'var(--neg)':'inherit'; }
        const cp = card.querySelector('.card-head .card-pnl');
        if (cp) {
            const pnlLabel = pnl >= 0 ? 'Increase since invested' : 'Decrease since invested';
            cp.textContent = pnlLabel + ': $' + Math.abs(pnl).toFixed(2);
            cp.style.color = pnl>.01?'var(--pos)':pnl<-.01?'var(--neg)':'var(--muted)';
        }
    }
    return val;
}

function updateSummary(inv, val) {
    const pnl = val - inv, pct = inv > 0 ? (pnl/inv)*100 : 0, s = pnl>=0?'+':'';
    document.getElementById('tot-inv').textContent = '$'+inv.toFixed(2);
    document.getElementById('tot-val').textContent = '$'+val.toFixed(2);
    const el = document.getElementById('tot-pnl');
    el.innerHTML = s+'$'+Math.abs(pnl).toFixed(2)+' <span style="font-size:.9rem;opacity:.8">('+s+Math.abs(pct).toFixed(2)+'%)</span>';
    el.className = 's-value '+(pnl>.01?'positive':pnl<-.01?'negative':'neutral');
}
